<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Image Compressor</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f4f7fb;
    color: #222;
}

.container {
    max-width: 560px;
    margin: 30px auto;
    padding: 25px;
    background: white;
    border-radius: 18px;
    box-shadow: 0 5px 25px rgba(0,0,0,0.08);
}

h1 {
    text-align: center;
    margin-bottom: 8px;
}

.subtitle {
    text-align: center;
    color: #666;
    margin-bottom: 25px;
}

.upload-box {
    border: 2px dashed #777;
    padding: 25px;
    text-align: center;
    border-radius: 14px;
    margin-bottom: 20px;
}

input[type="file"] {
    width: 100%;
}

.option-box,
.quality-box {
    margin: 20px 0;
}

.option-box label,
.quality-box label {
    display: block;
    font-weight: bold;
    margin-bottom: 8px;
}

select {
    width: 100%;
    padding: 12px;
    border: 1px solid #ccc;
    border-radius: 10px;
    font-size: 16px;
    background: white;
}

input[type="range"] {
    width: 100%;
}

.quality-value {
    font-weight: bold;
}

button,
.download-btn {
    display: block;
    width: 100%;
    padding: 14px;
    border: none;
    border-radius: 10px;
    font-size: 17px;
    cursor: pointer;
    text-align: center;
    text-decoration: none;
}

button {
    background: #222;
    color: white;
}

.download-btn {
    background: #168a3a;
    color: white;
    margin-top: 12px;
}

.image-card {
    margin-top: 20px;
    padding: 15px;
    background: #f1f3f5;
    border-radius: 12px;
}

.preview {
    width: 100%;
    max-height: 250px;
    object-fit: contain;
    border-radius: 10px;
    margin-bottom: 12px;
}

.info {
    line-height: 1.8;
}

.status {
    font-weight: bold;
    margin-top: 8px;
}

#images {
    margin-top: 15px;
}
</style>
</head>

<body>

<div class="container">

<h1>Image Compressor</h1>

<p class="subtitle">
Compress multiple images quickly and easily
</p>

<div class="upload-box">

<input
type="file"
id="imageInput"
accept="image/*"
multiple
>

<p>Select one or more images</p>

</div>

<div class="option-box">

<label for="format">
Output Format
</label>

<select id="format">

<option value="image/jpeg">JPG</option>
<option value="image/png">PNG</option>
<option value="image/webp">WebP</option>

</select>

</div>

<div class="quality-box">

<label>
Quality:
<span id="qualityValue" class="quality-value">70%</span>
</label>

<input
type="range"
id="quality"
min="10"
max="100"
value="70"
>

</div>

<button onclick="compressAll()">
Compress All Images
</button>

<div id="images"></div>

</div>

<script>

var selectedFiles = [];

document.getElementById("quality").oninput = function() {

    document.getElementById("qualityValue").innerText =
    this.value + "%";

};

document.getElementById("imageInput").onchange = function() {

    selectedFiles = Array.from(this.files);

    var imagesContainer =
    document.getElementById("images");

    imagesContainer.innerHTML = "";

    selectedFiles.forEach(function(file, index) {

        var card =
        document.createElement("div");

        card.className = "image-card";

        card.innerHTML =

        '<img class="preview" id="preview-' + index + '">' +

        '<div class="info">' +

        '<strong>' +
        file.name +
        '</strong><br>' +

        'Original size: ' +
        (file.size / 1024).toFixed(1) +
        ' KB<br>' +

        '<span id="compressed-' + index + '">' +
        'Compressed size: —' +
        '</span><br>' +

        '<span id="saving-' + index + '">' +
        'Size reduction: —' +
        '</span>' +

        '<div class="status" id="status-' + index + '">' +
        'Ready to compress' +
        '</div>' +

        '<a id="download-' + index + '" ' +
        'class="download-btn" ' +
        'style="display:none;">' +
        'Download Compressed Image' +
        '</a>' +

        '</div>';

        imagesContainer.appendChild(card);

        var preview =
        document.getElementById("preview-" + index);

        preview.src =
        URL.createObjectURL(file);

    });

};

function compressAll() {

    if (selectedFiles.length === 0) {

        alert("Please select at least one image.");

        return;
    }

    selectedFiles.forEach(function(file, index) {

        compressOne(file, index);

    });

}

function compressOne(file, index) {

    var quality =
    document.getElementById("quality").value / 100;

    var format =
    document.getElementById("format").value;

    document.getElementById("status-" + index).innerText =
    "Compressing...";

    var reader =
    new FileReader();

    reader.onload = function(e) {

        var img = new Image();

        img.onload = function() {

            var canvas =
            document.createElement("canvas");

            var ctx =
            canvas.getContext("2d");

            canvas.width =
            img.width;

            canvas.height =
            img.height;

            ctx.drawImage(
                img,
                0,
                0,
                canvas.width,
                canvas.height
            );

            canvas.toBlob(function(blob) {

                if (!blob) {

                    document.getElementById(
                        "status-" + index
                    ).innerText =
                    "Compression failed.";

                    return;
                }

                var compressedKB =
                blob.size / 1024;

                

                document.getElementById(
                    "compressed-" + index
                ).innerText =

                "Compressed size: " +
                compressedKB.toFixed(1) +
                " KB";

                
var savingElement =
    document.getElementById("saving-" + index);

if (blob.size < file.size) {

    var reduction =
        ((1 - blob.size / file.size) * 100);

    savingElement.innerText =
        "Size reduction: " +
        reduction.toFixed(1) +
        "%";

} else {

    savingElement.innerText =
        "File size increased after compression";

    }
                document.getElementById(
                    "status-" + index
                ).innerText =

                "Compression complete!";

                var extension = "jpg";

                if (format === "image/png") {
                    extension = "png";
                }

                if (format === "image/webp") {
                    extension = "webp";
                }

                var link =
                document.getElementById(
                    "download-" + index
                );

                link.href =
                URL.createObjectURL(blob);

                link.download =
                "compressed-image-" +
                (index + 1) +
                "." +
                extension;

                link.style.display =
                "block";

            }, format, quality);

        };

        img.src = e.target.result;

    };

    reader.readAsDataURL(file);

}

</script>

</body>
    </html>
